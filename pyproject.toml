[project]
name = "claims-mcp-server"
version = "0.1.0"
description = "Read-only MCP server over a synthetic health-insurance claims database"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Adwitiya Pandey" },
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
claims-mcp-server = "claims_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_mcp"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.28",
]
